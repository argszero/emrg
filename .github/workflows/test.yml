name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # #441 教训：workflow 文件的 if: secrets 等解析错误人工审查易漏
      # （actionlint 可捕获），push 后才在 build-release 触发时暴露。
      # → CI 全量校验所有 workflow，解析错误立即失败（R82 固化）。
      - name: Actionlint (workflow lint)
        uses: rhysd/actionlint@v1.7.12
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest tests/ -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: GUI unit tests (G55)
        working-directory: emrg/gui
        run: |
          npm ci --omit=dev
          EMRG_SKIP_INTEGRATION=1 npm test
      - name: GUI integration tests (G73 isolated HOME)
        working-directory: emrg/gui
        run: npm run test:integration
      - name: GUI syntax check (main/preload/renderer)
        working-directory: emrg/gui
        run: |
          node --check main.js && node --check preload.js && node --check daemon_client.js
          # renderer JS — 兼容旧扁平结构（renderer/*.js）与新 js/ 子目录结构（renderer/js/*.js，#417）
          for f in renderer/app.js renderer/markdown.js renderer/js/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || exit 1
          done

  # v0.2.29 教训：Windows pytest 此前只在 tag 触发的 Build Release 跑
  # （test.yml 仅 ubuntu）——FakeGitRun git.EXE 大小写 bug（#723）等 Windows-only
  # 测试回归要到发版构建才暴露。每个 PR 都应在 Windows 上跑 pytest 门禁。
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Python tests (Windows)
        run: uv run pytest tests/ -v
      - name: Inno Setup script compiles (Windows)
        shell: bash
        run: |
          set -euo pipefail
          # v0.2.30 教训：Test 绿 ≠ .iss 可编译 — iscc（Inno Setup 6.7.1）只在 tag 触发的
          # Build Release 里跑；#727 的 stop-log 块首次过 iscc 即 "Invalid number of parameters"
          # （emrg.iss:183:47）。每个 PR 都应在 Windows 上编译一次生成的 emrg.iss。
          mkdir -p stage/payload/bin stage/artifacts
          touch stage/payload/placeholder.txt stage/payload/bin/stop-emrg.cmd
          ROOT_WIN="$(cygpath -m "$PWD")"
          export VERSION="0.0.0-test" DIST_WIN="$ROOT_WIN/stage" \
            ROOT_WIN="$ROOT_WIN" STAGE_WIN="$ROOT_WIN/stage"
          # 用与 make-installer.sh 相同的未加引号 heredoc 渲染（行 221-415）
          {
            echo 'cat > emrg-test.iss <<EOF'
            sed -n '221,415p' packaging/make-installer.sh
            echo 'EOF'
          } > render-iss.sh
          bash render-iss.sh
          if ! iscc emrg-test.iss > iscc.log 2>&1; then
            echo "::error::iscc compile failed — generated emrg-test.iss lines 170-200:"
            sed -n '170,200p' emrg-test.iss
            echo "::error::iscc output:"
            cat iscc.log
            exit 1
          fi
          echo "iscc compile OK"
