name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # #441 教训：workflow 文件的 if: secrets 等解析错误人工审查易漏
      # （actionlint 可捕获），push 后才在 build-release 触发时暴露。
      # → CI 全量校验所有 workflow，解析错误立即失败（R82 固化）。
      - name: Actionlint (workflow lint)
        uses: rhysd/actionlint@v1.7.12
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest tests/ -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: GUI unit tests (G55)
        working-directory: emrg/gui
        run: |
          npm ci --omit=dev
          EMRG_SKIP_INTEGRATION=1 npm test
      - name: GUI integration tests (G73 isolated HOME)
        working-directory: emrg/gui
        run: npm run test:integration
      - name: GUI syntax check (main/preload/renderer)
        working-directory: emrg/gui
        run: |
          node --check main.js && node --check preload.js && node --check daemon_client.js
          # renderer JS — 兼容旧扁平结构（renderer/*.js）与新 js/ 子目录结构（renderer/js/*.js，#417）
          for f in renderer/app.js renderer/markdown.js renderer/js/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || exit 1
          done

  # v0.2.29 教训：Windows pytest 此前只在 tag 触发的 Build Release 跑
  # （test.yml 仅 ubuntu）——FakeGitRun git.EXE 大小写 bug（#723）等 Windows-only
  # 测试回归要到发版构建才暴露。每个 PR 都应在 Windows 上跑 pytest 门禁。
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Python tests (Windows)
        run: uv run pytest tests/ -v
      # v0.2.30 教训（Build Release 31661378619）：Test 全绿 ≠ .iss 能编译。
      # make-installer.sh 的 emrg.iss 只在 tag 触发 Build Release 时经 iscc 编译，
      # #727 误用 LoadStringFromFile 单参数形式（Inno 真实签名是 2 参数 out-param）
      # → iscc "Invalid number of parameters" 发版才暴露。此处用 runner 预装的
      # iscc 编译渲染出的 emrg.iss（stub payload），PR CI 即拦截 .iss 语法/签名错误。
      - name: Inno Setup script compile smoke test
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/payload/bin" "$STAGE/dist/artifacts"
          touch "$STAGE/payload/bin/stop-emrg.cmd"
          # 渲染 make-installer.sh 的 emrg.iss heredoc（变量展开与真实构建一致）。
          # 先赋值再统一 export（单行 export 内自引用触发 shellcheck SC2318/SC2097/SC2098）。
          VERSION="0.0.0-smoke"
          DIST_WIN="$(cygpath -m "$STAGE/dist")"
          STAGE_WIN="$(cygpath -m "$STAGE")"
          ROOT_WIN="$(cygpath -m "$PWD")"
          export VERSION DIST_WIN STAGE_WIN ROOT_WIN STAGE
          sed -n '/cat > "\$STAGE\/emrg.iss" <<EOF/,/^EOF$/p' packaging/make-installer.sh > "$STAGE/gen.sh"
          bash "$STAGE/gen.sh"
          command -v iscc >/dev/null 2>&1 || { echo "::error::iscc not on PATH (runner image regression)"; exit 1; }
          iscc "$STAGE/emrg.iss"
