name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # #441 教训：workflow 文件的 if: secrets 等解析错误人工审查易漏
      # （actionlint 可捕获），push 后才在 build-release 触发时暴露。
      # → CI 全量校验所有 workflow，解析错误立即失败（R82 固化）。
      - name: Actionlint (workflow lint)
        uses: rhysd/actionlint@v1.7.12
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest tests/ -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Node deps (GUI + renderer)
        run: |
          # GUI: `--omit=dev` keeps electron/electron-builder out (the suite is
          # plain `node --test`), exactly as the pre-existing step did. Renderer
          # needs its devDependencies - vitest, tsc and vite all live there.
          (cd emrg/gui && npm ci --omit=dev)
          (cd emrg/gui/renderer && npm ci)
      # #1125 lesson: pytest guards the Agent.md counts *statically* (it counts
      # `it(`/`test(` in the source), and the pytest job has no node_modules to
      # check that model against the runners. Four separate escapes have been
      # found by hand (chained members, line-split calls, tagged templates,
      # nested subtests) - each one a form the static regex cannot see while the
      # runner executes it. `check-node-test-count.py` closes that loop the other
      # way round: it asks vitest and `node --test` what they actually executed
      # and fails if Agent.md disagrees. It needs node_modules, which is why it
      # lives here rather than in the pytest job.
      #
      # ⚠️ No flag: the *bare* invocation is the check mode (exit 1 on drift,
      # writes nothing). `--dry-run` is the preview of a repair and exits 0 even
      # when it prints FAIL - measured 2026-09-11, so gating on it would have
      # been a green step that never fails. `--write` is for a human/host.
      - name: Agent.md Node counts match the real runners
        run: uv run --no-sync python3 scripts/check-node-test-count.py
      - name: GUI unit tests (G55)
        working-directory: emrg/gui
        run: EMRG_SKIP_INTEGRATION=1 npm test
      - name: GUI renderer React suite (migration Batch 0)
        working-directory: emrg/gui/renderer
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: GUI integration tests (G73 isolated HOME)
        working-directory: emrg/gui
        run: npm run test:integration
      - name: GUI syntax check (main/preload/renderer)
        working-directory: emrg/gui
        run: |
          node --check main.js && node --check preload.js && node --check daemon_client.js
          # renderer JS — vanilla files deleted in Batch 5 cleanup (#1024); React
          # source is typechecked by tsc in the "GUI renderer React suite" step above

  # v0.2.29 教训：Windows pytest 此前只在 tag 触发的 Build Release 跑
  # （test.yml 仅 ubuntu）——FakeGitRun git.EXE 大小写 bug（#723）等 Windows-only
  # 测试回归要到发版构建才暴露。每个 PR 都应在 Windows 上跑 pytest 门禁。
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      # issue #1132 教训（v0.2.94 后）：`check-node-test-count.py` 的两个缺陷
      # （裸 `npm` 在 Windows 起不来 = WinError 2；locale 解码吞掉 UnicodeDecodeError
      # 后 `stdout=None` 抛裸 TypeError）都**只在这个平台可见**，却双双穿过全绿 CI。
      # 根因是这里只跑 pytest：那些探针在 `shutil.which("npm")` 为 None 时
      # `pytest.skip`（合理——缺工具链不是 `_run` 的缺陷），于是"本平台有没有 Node"
      # 变成了**镜像预装的偶然**，而不是这条 job 声明过的前提。
      # 显式 setup-node 让前提成立：真 runner 探针在此真正执行（pre-fix 会红），
      # 而不是悄悄跳过。ubuntu 的 `test` job 早已这样钉住（见其上 Node deps 步骤）。
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python tests (Windows)
        run: uv run pytest tests/ -v
      # v0.2.30 教训（Build Release 31661378619）：Test 全绿 ≠ .iss 能编译。
      # make-installer.sh 的 emrg.iss 只在 tag 触发 Build Release 时经 iscc 编译，
      # #727 误用 LoadStringFromFile 单参数形式（Inno 真实签名是 2 参数 out-param）
      # → iscc "Invalid number of parameters" 发版才暴露。此处用 runner 预装的
      # iscc 编译渲染出的 emrg.iss（stub payload），PR CI 即拦截 .iss 语法/签名错误。
      - name: Inno Setup script compile smoke test
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/payload/bin" "$STAGE/dist/artifacts"
          touch "$STAGE/payload/bin/stop_all.py"
          # icon.ico 是 gen-assets 产物（未入库）——生成最小合法 .ico 供 iscc 编译期
          # SetupIconFile 检查；{app}（={%USERPROFILE}\.emrg\install）引用的文件
          # （UninstallDisplayIcon/[Icons]/[UninstallRun]）也需存在。
          uv run python - <<'PY'
          import struct
          def write_ico(path):
              hdr = struct.pack('<HHH', 0, 1, 1)
              entry = struct.pack('<BBBBHHII', 1, 1, 0, 0, 1, 32, 44, 22)
              bih = struct.pack('<IiiHHIIiiII', 40, 1, 1, 1, 32, 0, 4, 0, 0, 0, 0)
              open(path, 'wb').write(hdr + entry + bih + b'\x00\x00\x00\x00')
          write_ico('packaging/assets/icon.ico')
          PY
          APP="$USERPROFILE/.emrg/install"
          mkdir -p "$APP/bin" "$APP/emrg-gui/EMRG"
          touch "$APP/bin/emrg.cmd" "$APP/bin/python.exe" "$APP/emrg-gui/EMRG/EMRG.exe"
          # 渲染 make-installer.sh 的 emrg.iss heredoc（变量展开与真实构建一致）。
          # 先赋值再统一 export（单行 export 内自引用触发 shellcheck SC2318/SC2097/SC2098）。
          VERSION="0.0.0-smoke"
          DIST_WIN="$(cygpath -m "$STAGE/dist")"
          STAGE_WIN="$(cygpath -m "$STAGE")"
          ROOT_WIN="$(cygpath -m "$PWD")"
          export VERSION DIST_WIN STAGE_WIN ROOT_WIN STAGE
          # 单引号内避免 \$ 字面量（shellcheck SC2016），用无 $ 的锚定模式
          sed -n '/cat > .*emrg\.iss.*<</,/^EOF$/p' packaging/make-installer.sh > "$STAGE/gen.sh"
          bash "$STAGE/gen.sh"
          command -v iscc >/dev/null 2>&1 || { echo "::error::iscc not on PATH (runner image regression)"; exit 1; }
          iscc "$STAGE/emrg.iss"
