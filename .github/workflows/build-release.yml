name: Build Release

# Phase 4 一键安装包构建流水线（rant #12 §11）。
# 触发：tag v* push。回归门禁：pytest 全绿后才构建。
#
# matrix:
#   macos-15(arm64)        → EMRG-<ver>-macos-arm64.pkg
#   ubuntu-24.04(x86_64)   → EMRG-<ver>-linux-x86_64.AppImage + tar.gz
#   ubuntu-24.04-arm(aarch64) → EMRG-<ver>-linux-aarch64.AppImage + tar.gz
#   windows-2025(x64)      → EMRG-<ver>-windows-x64.exe
#
# 冒烟在无 Python runner 上跑（R111 验证干净机器承诺）；离线冒烟（R96）
# 在 Linux job 用 iptables 断网执行。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: EMRG-*-macos-arm64.pkg
          - os: ubuntu-24.04
            arch: x86_64
            artifact: EMRG-*-linux-x86_64.AppImage
          - os: ubuntu-24.04-arm
            arch: aarch64
            artifact: EMRG-*-linux-aarch64.AppImage
          - os: windows-2025
            arch: x64
            artifact: EMRG-*-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv (Python 3.13)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # ── macOS 代码签名（rant 2026-08-06T10:06:55 P1/P2；Secret 未配则跳过降级）──
      - name: Import signing certificate (macOS only)
        if: runner.os == 'macOS' && secrets.MACOS_SIGNING_P12_BASE64 != ''
        shell: bash
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          echo "$MACOS_SIGNING_P12_BASE64" | base64 --decode > /tmp/signing.p12
          security create-keychain -p 'ci-temp' /tmp/ci.keychain
          security set-keychain-settings -lut 21600 /tmp/ci.keychain
          security unlock-keychain -p 'ci-temp' /tmp/ci.keychain
          security import /tmp/signing.p12 -k /tmp/ci.keychain -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -k 'ci-temp' /tmp/ci.keychain
          security list-keychains -d user -s /tmp/ci.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning /tmp/ci.keychain

      # ── 回归门禁 ─────────────────────────────────────────────
      - name: Python tests (regression gate)
        run: |
          uv sync --frozen
          uv run pytest tests/ -v

      # ── GUI tests ────────────────────────────────────────────
      - name: GUI unit tests
        working-directory: emrg/gui
        shell: bash
        run: |
          npm ci --omit=dev
          EMRG_SKIP_INTEGRATION=1 npm test

      - name: GUI integration tests (isolated HOME)
        working-directory: emrg/gui
        shell: bash
        # Windows 上集成测试不可靠（spawn daemon + HOME 隔离语义不同，port 文件 15s 超时）
        # → Windows 跳过，仅 POSIX 跑（unit tests 已覆盖协议逻辑）
        if: runner.os != 'Windows'
        run: npm run test:integration

      # ── Runtime 构建（§3）────────────────────────────────────
      - name: Build runtime (standalone python + source + lib)
        shell: bash
        run: bash packaging/build-runtime.sh

      # ── GUI dist（electron-builder；linux extraResources runtime §5 R64）──
      - name: Build GUI (electron-builder)
        working-directory: emrg/gui
        shell: bash
        env:
          # macOS 签名：CSC_LINK+CSC_KEY_PASSWORD 激活 electron-builder 自动 codesign
          # （含 hardened runtime；Secret 未配时为空 → 不签名，保持现状降级）
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_P12_BASE64 != '' && 'file:///tmp/signing.p12' || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
        run: |
          npm ci
          npm run dist

      # ── 捆绑 git/gh（§6 R59：macOS/Linux 源码编译，Windows portable）──
      - name: Bundle git + gh
        shell: bash
        run: bash packaging/bundle-git-gh.sh

      # ── 安装器（§10）────────────────────────────────────────
      - name: Make installer
        shell: bash
        run: bash packaging/make-installer.sh

      # ── pkg 签名（macOS only，P2；Secret 未配则跳过降级）──
      - name: Sign pkg (macOS only)
        if: runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY != ''
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          PKG="$(ls dist/artifacts/EMRG-*-macos-*.pkg | head -1)"
          if [ -z "$PKG" ]; then echo "no pkg found, skipping"; exit 0; fi
          productsign --sign "$MACOS_SIGNING_IDENTITY" "$PKG" "${PKG}.signed"
          mv "${PKG}.signed" "$PKG"
          pkgutil --check-signature "$PKG" || true

      # ── 冒烟（§12，临时 HOME + 无 Python runner）────────────
      - name: Smoke test (R42 temp HOME)
        shell: bash
        run: bash packaging/smoke-test.sh dist/runtime

      - name: Smoke offline (Linux only, R96)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo iptables -A OUTPUT -p tcp --dport 443 -j DROP || true
          sudo iptables -A OUTPUT -p tcp --dport 80 -j DROP || true
          bash packaging/smoke-test.sh dist/runtime || true
          sudo iptables -D OUTPUT -p tcp --dport 443 -j DROP || true
          sudo iptables -D OUTPUT -p tcp --dport 80 -j DROP || true

      # ── 产物上传 ─────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: emrg-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/artifacts/*.pkg
            dist/artifacts/*.exe
            dist/artifacts/*.AppImage
            dist/artifacts/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # R115: GITHUB_TOKEN 默认无 contents:write → softprops/action-gh-release
    # 创建 release 403（Resource not accessible by integration）。
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
