name: Build Release

# Phase 4 一键安装包构建流水线（rant #12 §11）。
# 触发：tag v* push。回归门禁：pytest 全绿后才构建。
#
# matrix:
#   macos-15(arm64)        → EMRG-<ver>-macos-arm64.pkg
#   ubuntu-24.04(x86_64)   → EMRG-<ver>-linux-x86_64.AppImage + tar.gz
#   ubuntu-24.04-arm(aarch64) → EMRG-<ver>-linux-aarch64.AppImage + tar.gz
#   windows-2025(x64)      → EMRG-<ver>-windows-x64.exe
#
# 冒烟在无 Python runner 上跑（R111 验证干净机器承诺）；离线冒烟（R96）
# 在 Linux job 用 iptables 断网执行。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: EMRG-*-macos-arm64.pkg
          - os: ubuntu-24.04
            arch: x86_64
            artifact: EMRG-*-linux-x86_64.AppImage
          - os: ubuntu-24.04-arm
            arch: aarch64
            artifact: EMRG-*-linux-aarch64.AppImage
          - os: windows-2025
            arch: x64
            artifact: EMRG-*-windows-x64.exe
    runs-on: ${{ matrix.os }}
    env:
      # secrets 不能在 if: 中直接引用（GitHub Actions 硬限制，否则 workflow 解析失败）。
      # 先提升为 job 级 env（允许 secrets context）；未配置时求值为空字符串 → 跳过降级。
      MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      # Installer 证书（rant 2026-08-06T15:26：双 p12 方案，宿主已配置 3 个新 Secret；
      # 未配置时降级为单 p12 方案——Install 证书在 MACOS_SIGNING_P12_BASE64 内）
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
      MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
      # 公证（P2 后半，rant 2026-08-06T10:06:55）：APPLE_ID 等 Secret 未配则跳过降级
      APPLE_ID: ${{ secrets.APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv (Python 3.13)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # ── macOS 代码签名（rant 2026-08-06T10:06:55 P1/P2；Secret 未配则跳过降级）──
      - name: Import signing certificate (macOS only)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12_BASE64 != ''
        shell: bash
        run: |
          echo "$MACOS_SIGNING_P12_BASE64" | base64 --decode > /tmp/signing.p12
          security create-keychain -p 'ci-temp' /tmp/ci.keychain
          security default-keychain -s /tmp/ci.keychain
          security set-keychain-settings -lut 21600 /tmp/ci.keychain
          security unlock-keychain -p 'ci-temp' /tmp/ci.keychain
          # 私钥存在性校验（v0.2.7 根因：p12 仅证书链无私钥 → set-key-partition-list 报
          # "SecItemCopyMatching: item not found" 的 cryptic 错误）。实测（macOS 本机）：
          #   p12 含私钥 → "N identity(ies) imported."（1 个单数、多 个复数）；仅证书链 → "N certificates imported."
          # import 输出捕获后校验 identity/identities 行，缺失即明确报错，指引宿主重新导出含私钥的 p12。
          IMPORT_OUTPUT="$(security import /tmp/signing.p12 -k /tmp/ci.keychain -P "$MACOS_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign 2>&1)"
          echo "$IMPORT_OUTPUT"
          if [[ ! "$IMPORT_OUTPUT" =~ identit(y|ies)\ imported ]]; then
            echo "::error::MACOS_SIGNING_P12_BASE64 未包含可签名私钥（security import 仅导入证书链）。请从 Keychain Access 导出含私钥的 p12（证书右键 → 导出 → 勾选\"包含私钥\"），重新 base64 后更新 GitHub Secret。import 输出：${IMPORT_OUTPUT}"
            exit 1
          fi
          # 双 p12 方案（rant 2026-08-06T15:26）：若配置了独立的 Installer p12
          # Secret，则导入它（含 Developer ID Installer 证书+私钥），覆盖单 p12 方案。
          # 未配置时降级为单 p12 方案（Installer 证书必须在 MACOS_SIGNING_P12_BASE64 内）。
          if [ -n "${MACOS_INSTALLER_P12_BASE64:-}" ]; then
            echo "==> 双 p12 方案：导入 Installer p12"
            echo "$MACOS_INSTALLER_P12_BASE64" | base64 --decode > /tmp/installer.p12
            INSTALLER_IMPORT="$(security import /tmp/installer.p12 -k /tmp/ci.keychain -P "$MACOS_INSTALLER_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign 2>&1)"
            echo "$INSTALLER_IMPORT"
            if [[ ! "$INSTALLER_IMPORT" =~ identit(y|ies)\ imported ]]; then
              echo "::error::MACOS_INSTALLER_P12_BASE64 未包含可签名私钥（security import 仅导入证书链）。请重新导出含私钥的 Installer p12 后更新 GitHub Secret。import 输出：${INSTALLER_IMPORT}"
              exit 1
            fi
          fi
          # 双证书存在性校验（v0.2.7 第 7 次构建根因：p12 只有 Developer ID
          # Application 证书——签 .app 成功，但 productsign 签 pkg 需要独立的
          # Developer ID Installer 证书，缺失报 "An installer signing identity (not
          # an application signing identity) is required" 的 cryptic 错误）。
          # 支持两种方案（rant 2026-08-06T15:26）：
          #   单 p12 方案：MACOS_SIGNING_P12_BASE64 同时含 Application + Installer
          #   双 p12 方案：MACOS_SIGNING_P12_BASE64 含 Application，MACOS_INSTALLER_P12_BASE64 含 Installer
          # 两种证书必须同时存在。find-certificate 不受 policy 限制。
          # ⚠️ 必须用输出判空而非退出码：实测 find-certificate 无匹配证书时
          # 也返回 exit 0（正反两态验证，#455 教训）。
          for CERT_NAME in "Developer ID Application" "Developer ID Installer"; do
            if [ -z "$(security find-certificate -c "$CERT_NAME" -a /tmp/ci.keychain 2>/dev/null)" ]; then
              echo "::error::keychain 缺少 $CERT_NAME 证书（签名必需）。Developer ID Application 用于签 .app（electron-builder codesign），Developer ID Installer 用于签 pkg（productsign），两张证书缺一不可。单 p12 方案：用 \`security export -t identities\` 连同私钥一并导出；双 p12 方案：检查 MACOS_INSTALLER_P12_BASE64 是否正确配置。"
              exit 1
            fi
          done
          # set-key-partition-list 与 electron-builder macCodeSign.js 完全一致：
          #   security set-key-partition-list -S apple-tool:,apple: -s -k <password> <keychain>
          # -s = Match keys that can sign（必须显式提供才能定位私钥项目）；
          # -S apple-tool:,apple:（⚠️ 不可加 codesign: 分区——实测 v0.2.7 构建
          #   #453 加 codesign: 后仍 SecItemCopyMatching: item not found）。
          security set-key-partition-list -S apple-tool:,apple: -s -k 'ci-temp' /tmp/ci.keychain
          # SC2046: -s 需要将每个 keychain 路径作为独立参数传递，词分割是有意的
          # shellcheck disable=SC2046
          security list-keychains -d user -s /tmp/ci.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning /tmp/ci.keychain

      # ── 回归门禁 ─────────────────────────────────────────────
      - name: Python tests (regression gate)
        run: |
          uv sync --frozen
          uv run pytest tests/ -v

      # ── GUI tests ────────────────────────────────────────────
      - name: GUI unit tests
        working-directory: emrg/gui
        shell: bash
        run: |
          npm ci --omit=dev
          EMRG_SKIP_INTEGRATION=1 npm test

      - name: GUI integration tests (isolated HOME)
        working-directory: emrg/gui
        shell: bash
        # Windows 上集成测试不可靠（spawn daemon + HOME 隔离语义不同，port 文件 15s 超时）
        # → Windows 跳过，仅 POSIX 跑（unit tests 已覆盖协议逻辑）
        if: runner.os != 'Windows'
        run: npm run test:integration

      # ── Runtime 构建（§3）────────────────────────────────────
      - name: Build runtime (standalone python + source + lib)
        shell: bash
        run: bash packaging/build-runtime.sh

      # ── 图标资产生成（rant 2026-08-11T18:28:09：仓库只保留 icon.svg 设计源，
      #     png/icns/ico 由 CI 构建时现生成，必须先于 GUI 构建执行）──
      - name: Generate icon assets (icon.svg → png/icns/ico)
        shell: bash
        run: |
          set -euo pipefail
          if command -v rsvg-convert >/dev/null 2>&1; then
            echo "rsvg-convert already available"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install librsvg
          else
            echo "no rsvg-convert; gen-assets.sh will fall back to Chrome/Edge headless"
          fi
          bash packaging/gen-assets.sh
          # 产物必须存在（GUI 构建引用 ../packaging/assets/*.png/icns/ico）
          test -s packaging/assets/icon.png
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -s packaging/assets/icon.icns
          fi
          test -s packaging/assets/icon.ico

      # ── GUI dist（electron-builder；linux extraResources runtime §5 R64）──
      - name: Build GUI (electron-builder)
        working-directory: emrg/gui
        shell: bash
        run: |
          npm ci
          # macOS 签名：仅在 macOS + 有证书时导出 CSC_LINK/CSC_KEY_PASSWORD，
          # 激活 electron-builder 自动 codesign（含 hardened runtime）。
          # ⚠️ 不可在 step env 里设空字符串：electron-builder 对空 CSC_LINK 仍走签名分支
          # （path.resolve("") = 工作目录 → "WIN_CSC_LINK is not correct ... not a file"，
          # v0.2.7 windows job 失败根因）。未设置 = 不签名，保持降级。
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "${MACOS_SIGNING_P12_BASE64:-}" ]; then
            export CSC_LINK="file:///tmp/signing.p12"
            export CSC_KEY_PASSWORD="$MACOS_SIGNING_P12_PASSWORD"
          fi
          npm run dist

      # ── 捆绑 git/gh（§6 R59：macOS/Linux 源码编译，Windows portable）──
      - name: Bundle git + gh
        shell: bash
        run: bash packaging/bundle-git-gh.sh

      # ── 安装器（§10）────────────────────────────────────────
      - name: Make installer
        shell: bash
        run: bash packaging/make-installer.sh

      # ── zip 安装包（Windows only，rant 2026-08-10T20:10:41）──
      # 宿主反馈：除 exe 安装包外再提供 zip 压缩版（内容 = 同名 exe），
      # 方便直接解压使用/分发。压缩后产物 EMRG-<ver>-windows-x64.zip
      # 走下方 Upload artifacts（glob 需含 *.zip）。
      - name: Zip installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist/artifacts
          EXE="$(find . -maxdepth 1 -name 'EMRG-*-windows-x64.exe' | head -1)"
          if [ -z "$EXE" ]; then
            echo "::error::no EMRG-*-windows-x64.exe found in dist/artifacts"
            exit 1
          fi
          ZIP="${EXE%.exe}.zip"
          powershell -NoProfile -Command "Compress-Archive -Force -Path \"$EXE\" -DestinationPath \"$ZIP\""
          ls -la
          test -s "$ZIP"

      # ── pkg 签名（macOS only，P2；Secret 未配则跳过降级）──
      # ⚠️ productsign 需要 Developer ID Installer 身份（非 Application 身份）——
      # 实测 #462：MACOS_SIGNING_IDENTITY 配 Application 身份报
      # "An installer signing identity (not an application signing identity) is required"。
      # 优先用宿主配置的 MACOS_INSTALLER_IDENTITY（rant 2026-08-06T15:26 双 p12 方案），
      # 未配置则从 keychain 自动检测 Installer 身份（单 p12 方案，#462）。
      - name: Sign pkg (macOS only)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12_BASE64 != ''
        shell: bash
        run: |
          PKG="$(find dist/artifacts -maxdepth 1 -name 'EMRG-*-macos-*.pkg' | head -1)"
          if [ -z "$PKG" ]; then echo "no pkg found, skipping"; exit 0; fi
          INSTALLER_ID="${MACOS_INSTALLER_IDENTITY:-}"
          if [ -z "$INSTALLER_ID" ]; then
            INSTALLER_ID="$(security find-identity -v /tmp/ci.keychain | grep 'Developer ID Installer' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          if [ -z "$INSTALLER_ID" ]; then
            echo "::error::pkg 签名需要 Developer ID Installer 证书（productsign 不接受 Application 身份）。请配置 MACOS_INSTALLER_IDENTITY + MACOS_INSTALLER_P12_BASE64（双 p12 方案），或用 security export -t identities 导出含 Installer 的 p12 到 MACOS_SIGNING_P12_BASE64（单 p12 方案）。"
            exit 1
          fi
          productsign --sign "$INSTALLER_ID" "$PKG" "${PKG}.signed"
          mv "${PKG}.signed" "$PKG"
          # P3 验证：证书存在时签名必须成功（rant 验收：pkgutil 显示 signed by Developer ID）
          pkgutil --check-signature "$PKG"

      # ── pkg 公证（macOS only，P2 后半；Secret 未配则跳过降级）──
      # notarytool submit --wait：轮询直至 Accepted/Invalid。
      # ⚠️ 实测（run 31081477123，#475）：公证结果 Invalid 时 notarytool 退出码仍为 0
      # （提交处理完成 ≠ 通过），若不解析 status 字段会继续 Staple → 报 cryptic 的
      # "Record not found" Error 65，掩盖真实 rejection 原因。必须显式解析并抓 log。
      # --timeout 20m：设计文档 §4.4 明确要求（默认 10m，Apple 公证排队高峰可能超时）
      - name: Notarize pkg (macOS only)
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.MACOS_NOTARY_APP_PASSWORD != '' && env.MACOS_NOTARY_TEAM_ID != ''
        shell: bash
        run: |
          PKG="$(find dist/artifacts -maxdepth 1 -name 'EMRG-*-macos-*.pkg' | head -1)"
          if [ -z "$PKG" ]; then echo "no pkg found, skipping"; exit 0; fi
          NOTARY_OUT="$(xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait --timeout 20m --output-format json 2>&1)"
          echo "$NOTARY_OUT"
          # 解析提交 ID 与状态（--output-format json 输出 {"id","message","status"}）
          SUB_ID="$(printf '%s' "$NOTARY_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)"
          STATUS="$(printf '%s' "$NOTARY_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)"
          if [ -z "$SUB_ID" ] || [ -z "$STATUS" ]; then
            echo "::error::notarytool 输出解析失败（无法获取提交 ID/状态），请手动运行 notarytool submit 排查。原始输出：$NOTARY_OUT"
            exit 1
          fi
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Apple 公证未通过（status=$STATUS, submission-id=$SUB_ID）。抓取 rejection 日志定位原因："
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$MACOS_NOTARY_APP_PASSWORD" \
              --team-id "$MACOS_NOTARY_TEAM_ID" || echo "（notarytool log 拉取失败，请用上述命令手动查看）"
            exit 1
          fi
          echo "✅ 公证通过（status=Accepted, submission-id=$SUB_ID）"

      - name: Staple pkg (macOS only)
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.MACOS_NOTARY_APP_PASSWORD != '' && env.MACOS_NOTARY_TEAM_ID != ''
        shell: bash
        run: |
          PKG="$(find dist/artifacts -maxdepth 1 -name 'EMRG-*-macos-*.pkg' | head -1)"
          if [ -z "$PKG" ]; then echo "no pkg found, skipping"; exit 0; fi
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          # P3 终验（rant 验收 + 设计文档 §5.1）：spctl 确认 Gatekeeper 接受
          # （签名 + 公证 + staple 全链路的最终裁决；期望输出 "accepted"）
          # ⚠️ --type install 必需（#477 教训）：spctl 默认类型为 execute，
          # 对 pkg 评估返回 "no usable signature"（exit 3）——即使 pkg 已用
          # Developer ID Installer 签名 + 公证 Accepted + staple 成功。
          # 实测：xcrun stapler staple/validate 均 work，pkgutil --check-signature
          # 显示 "signed by a developer certificate issued by Apple for distribution"，
          # 公证 status=Accepted（run 31082935194），但 spctl -a -vv 报
          # "rejected, source=no usable signature"。加 --type install 后正确评估 pkg。
          spctl -a -vv --type install "$PKG"

      # ── 冒烟（§12，临时 HOME + 无 Python runner）────────────
      - name: Smoke test (R42 temp HOME)
        shell: bash
        run: bash packaging/smoke-test.sh dist/runtime

      - name: Smoke offline (Linux only, R96)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo iptables -A OUTPUT -p tcp --dport 443 -j DROP || true
          sudo iptables -A OUTPUT -p tcp --dport 80 -j DROP || true
          bash packaging/smoke-test.sh dist/runtime || true
          sudo iptables -D OUTPUT -p tcp --dport 443 -j DROP || true
          sudo iptables -D OUTPUT -p tcp --dport 80 -j DROP || true

      # ── 产物上传 ─────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: emrg-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/artifacts/*.pkg
            dist/artifacts/*.exe
            dist/artifacts/*.AppImage
            dist/artifacts/*.tar.gz
            dist/artifacts/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # R115: GITHUB_TOKEN 默认无 contents:write → softprops/action-gh-release
    # 创建 release 403（Resource not accessible by integration）。
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
